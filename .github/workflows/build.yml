name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          [ -z "$chosen" ] && { ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$chosen/Contents/Developer"
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          udid=$(xcrun simctl list devices available | grep "$name (" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build -project FairwayLedger.xcodeproj -scheme FairwayLedger -configuration Debug             -destination "id=$udid" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Screenshots
        timeout-minutes: 25
        run: |
          udid=$UDID
          xcrun simctl shutdown all || true
          xcrun simctl boot "$udid" || true
          for i in $(seq 1 60); do
            xcrun simctl spawn "$udid" launchctl print system >/dev/null 2>&1 && break
            sleep 5
          done
          sleep 20
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$udid" appearance dark || true
          app=$(find dd/Build/Products -name "FairwayLedger.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          # A warm-up launch: the first screenshot after install can come out blank.
          xcrun simctl launch "$udid" com.mattbusel.fairwayledger -shot home; sleep 8
          i=0
          for shot in home scorecard widgets plan poster rounds course stats live shop paywall locked; do
            xcrun simctl terminate "$udid" com.mattbusel.fairwayledger || true
            xcrun simctl launch "$udid" com.mattbusel.fairwayledger -shot $shot
            sleep 8
            xcrun simctl io "$udid" screenshot "shots/$(printf %02d $i)-$shot.png"
            i=$((i+1))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
